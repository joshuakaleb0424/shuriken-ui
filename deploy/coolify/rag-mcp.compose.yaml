services:
  mcp:
    build:
      context: .
      dockerfile: packages/rag-mcp/Dockerfile
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set a long random team access token in Coolify.}
      PORT: '3000'
      RAG_COLLECTION: ${RAG_COLLECTION:-shuriken-ui-v4}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-nomic-embed-text}
      RAG_OLLAMA_URL: http://ollama:11434
      RAG_PACKAGE_VERSION: ${RAG_PACKAGE_VERSION:-4.0.0}
      RAG_QDRANT_URL: http://qdrant:6333
    depends_on:
      indexer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  qdrant:
    image: ${QDRANT_IMAGE:?Set a tested, pinned Qdrant image tag in Coolify.}
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ${OLLAMA_IMAGE:?Set a tested, pinned Ollama image tag in Coolify.}
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  indexer:
    build:
      context: .
      dockerfile: packages/rag-mcp/Dockerfile
    command: ["node", "dist/index-corpus.js", "/app", "--recreate"]
    environment:
      RAG_COLLECTION: ${RAG_COLLECTION:-shuriken-ui-v4}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-nomic-embed-text}
      RAG_OLLAMA_URL: http://ollama:11434
      RAG_PACKAGE_VERSION: ${RAG_PACKAGE_VERSION:-4.0.0}
      RAG_QDRANT_URL: http://qdrant:6333
    depends_on:
      ollama:
        condition: service_started
      qdrant:
        condition: service_started
    restart: 'no'
    exclude_from_hc: true

volumes:
  ollama-data:
  qdrant-data:
